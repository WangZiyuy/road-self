BASE_CONFIG: stage_s3_common.yml

S3:
  STAGE: seg_raster_stage_s3c
  RUN_ROOT: data_self/stage_s3c_seg_raster
  SAMPLE_PLAN: data_self/stage_s3c_seg_raster/runtime/sample_plan.json
  METRICS_INTERVAL: 25
  HEARTBEAT_SECONDS: 60
  VALIDATION_BATCHES: 8
  FIXED_THRESHOLD: 0.3
  PRECISION: fp32
  EFFECTIVE_BATCH_SIZE: 20
  GRADIENT_ACCUMULATION: 2
  ANCHOR_GRAD_TO_SEG: false

TRAJ:
  SEQUENCE:
    ENABLED: false
  RASTER:
    ANCHOR_GRAD_TO_SEG: false

TRAIN:
  BATCH_SIZE: 10
  # Each frozen Xi'an spatial half exposes two eligible subtiles. Five
  # independent Path replicas recover the official local batch of ten without
  # reusing one mutable explorer twice inside a micro-batch.
  SPATIAL_PATH_REPLICAS: 5
  OPTIMIZER_STEPS: 2048
  SOLVER:
    METHOD: Adam
    LEARNING_RATE: 0.00001
    WEIGHT_DECAY: 0.0002
    SCHEDULER: none
    WARMUP_STEPS: 0
    GRADIENT_CLIP_KIND: value
    GRADIENT_CLIP_VALUE: 10000.0

S3C:
  MAX_SAMPLES_SEEN: 40960
  MICRO_BATCH_PER_GPU: 10
  GRADIENT_ACCUMULATION: 2
  EFFECTIVE_SAMPLES_PER_UPDATE: 20
  SAMPLE_GRID: [0, 2560, 5120, 7680, 10240, 12800, 15360, 17920, 20480, 25600, 30720, 35840, 40960]
  BASELINE_CHECKPOINT_ENV: S3C_BASELINE_CHECKPOINT
  JUNCTION_POS_WEIGHT_CAP: 32.0
  GRAPH_CAPS:
    MAX_GRAPH_ITERATIONS: 3000
    MAX_GRAPH_VERTICES: 5000
    MAX_DIRECTED_EDGES: 10000
    MAX_GRAPH_WALL_TIME_SECONDS: 900
