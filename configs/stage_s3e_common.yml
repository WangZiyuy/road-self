BASE_CONFIG: stage_s3_common.yml

S3:
  STAGE: seg_raster_stage_s3e
  RUN_ROOT: data_self/stage_s3e_seg_raster
  SAMPLE_PLAN: data_self/stage_s3e_seg_raster/runtime/sample_plan.json
  METRICS_INTERVAL: 25
  HEARTBEAT_SECONDS: 60
  VALIDATION_BATCHES: 8
  DIAGNOSTIC_VALIDATION_BATCHES: 1
  FIXED_THRESHOLD: 0.3
  PRECISION: fp32
  EFFECTIVE_BATCH_SIZE: 20
  GRADIENT_ACCUMULATION: 2
  ANCHOR_GRAD_TO_SEG: false

TRAJ:
  MODE: raster_road_zero_preserving
  SEQUENCE:
    ENABLED: false
  RASTER:
    INPUT_SEMANTICS: binary_presence
    CONTROL: aligned
    ANCHOR_GRAD_TO_SEG: false
    PROJECTION_INIT: default
    USE_SUPPORT_MULTIPLIER: true

S3E:
  DENSE_UPDATE_GRID: [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 384, 512]
  FULL_VALIDATION_UPDATE_GRID: [0, 32, 128, 256, 512]
  FIRST_FUNCTIONAL_HEAD_DRIFT_AUPRC: -0.002
  FIRST_FUNCTIONAL_HEAD_DRIFT_F1: -0.005
  ZERO_INIT_MAJOR_GAP_REDUCTION: 0.50
  ZERO_INIT_MINOR_GAP_REDUCTION: 0.20
  MECHANISM_HEAD_DRIFT_GAP_REDUCTION: 0.20
  MECHANISM_AUPRC_IMPROVEMENT: 0.002
  MECHANISM_RECALL_IMPROVEMENT: 0.01
  PARITY_ATOL: 1.0e-7
  PARITY_RTOL: 1.0e-6

TRAIN:
  BATCH_SIZE: 10
  SPATIAL_PATH_REPLICAS: 5
  OPTIMIZER_STEPS: 2048
  SOLVER:
    METHOD: Adam
    LEARNING_RATE: 0.00001
    WEIGHT_DECAY: 0.0002
    SCHEDULER: none
    WARMUP_STEPS: 0
    GRADIENT_CLIP_KIND: value
    GRADIENT_CLIP_VALUE: 10000.0

S3D:
  MAX_SAMPLES_SEEN: 40960
  MICRO_BATCH_PER_GPU: 10
  GRADIENT_ACCUMULATION: 2
  EFFECTIVE_SAMPLES_PER_UPDATE: 20
  SAMPLE_GRID: [0, 2560, 5120, 7680, 10240, 12800, 15360, 17920, 20480, 25600, 30720, 35840, 40960]
  BASELINE_CHECKPOINT_ENV: S3D_BASELINE_CHECKPOINT
