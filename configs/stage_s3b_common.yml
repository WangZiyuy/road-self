BASE_CONFIG: stage_s3_common.yml

S3:
  STAGE: seg_raster_stage_s3b
  RUN_ROOT: data_self/stage_s3b_seg_raster
  METRICS_INTERVAL: 200
  HEARTBEAT_SECONDS: 60
  EVALUATION_INTERVAL: 2560
  VALIDATION_BATCHES: 8
  FIXED_THRESHOLD: 0.3
  BEST_METRIC: validation_repair_composite
  PRECISION: fp32
  ANCHOR_GRAD_TO_SEG: false

TRAJ:
  SEQUENCE:
    ENABLED: false
  RASTER:
    ANCHOR_GRAD_TO_SEG: false

TRAIN:
  OPTIMIZER_STEPS: 20480
  SOLVER:
    METHOD: Adam
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.0002
    SCHEDULER: none
    WARMUP_STEPS: 0
    GRADIENT_CLIP_KIND: value
    GRADIENT_CLIP_VALUE: 10000.0

S3B:
  CHECKPOINT_STEPS: [0, 2560, 5120, 7680, 10240, 12800, 15360, 17920, 20480]
  JUNCTION_LOSS: legacy_exact
  JUNCTION_POS_WEIGHT_CAP: 32.0
  JUNCTION_LOSS_ALPHA: 1.0
  DICE_WEIGHT: 1.0
  DICE_SMOOTH: 1.0
  EARLY_STOP_SIMULATION:
    MIN_STEPS: 5120
    PATIENCE_INTERVALS: 3
    MIN_DELTA: 0.0005
  GRAPH_CAPS:
    MAX_GRAPH_ITERATIONS: 3000
    MAX_GRAPH_VERTICES: 5000
    MAX_DIRECTED_EDGES: 10000
    MAX_GRAPH_WALL_TIME_SECONDS: 900
